name: Transfer 300SL Reference

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Clone public reference repository
        shell: bash
        run: |
          set -euxo pipefail
          git lfs install
          git clone --depth 1 https://github.com/utkarshroy96/Car_Configurator.git upstream
          cd upstream
          git lfs pull || true
          git rev-parse HEAD | tee /tmp/reference_commit.txt

      - name: Collect 300SL-related assets and license evidence
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package/files
          cd upstream
          find . -type f \( -iname '*300sl*' -o -iname '*300s*' -o -iname '*gullwing*' \) -print | sort | tee /tmp/reference_file_list.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mkdir -p "../package/files/$(dirname "$f")"
            cp -a "$f" "../package/files/$f"
          done < /tmp/reference_file_list.txt
          find . -maxdepth 3 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'README*' \) -print | sort | while IFS= read -r f; do
            mkdir -p "../package/files/$(dirname "$f")"
            cp -a "$f" "../package/files/$f"
          done
          cd ..
          cp /tmp/reference_commit.txt package/
          cp /tmp/reference_file_list.txt package/
          find package -type f -printf '%p %s bytes\n' | sort | tee package/package_manifest.txt
          tar --zstd -cf /tmp/300sl-reference.tar.zst -C package .
          ls -lh /tmp/300sl-reference.tar.zst

      - name: Upload reference package
        uses: actions/upload-artifact@v4
        with:
          name: 300sl-reference
          path: /tmp/300sl-reference.tar.zst
          compression-level: 0
          retention-days: 1
