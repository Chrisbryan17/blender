name: Transfer modern car donors v2
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download CC-BY Sketchfab models through Objaverse
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install objaverse
          python - <<'PY'
          import objaverse, pathlib, shutil, json
          # Multiple CC-BY candidates. Older Sketchfab UIDs are more likely to be present in Objaverse 1.0.
          candidates = {
              'camaro_2010_low': '47064839d8244769baeb9d60e22ecf7b',
              'gt350r_older': 'f8473512ab734e35a518c5d373df1d05',
              'challenger_2015': '71844c018a8949598d3dbeeae6a09d54',
              'camaro_2010_newer': 'b2845536739542e1a4493a192990f91b',
              'gt350r_newer': '68d385c23b3a415ab7de6f80cdc5cd70',
          }
          out = pathlib.Path('/tmp/modern-car-donors-v2')
          out.mkdir(parents=True, exist_ok=True)
          paths = objaverse.load_objects(uids=list(candidates.values()), download_processes=1)
          manifest = {'found': {}, 'missing': {}}
          for label, uid in candidates.items():
              pth = paths.get(uid)
              if not pth:
                  manifest['missing'][label] = uid
                  continue
              p = pathlib.Path(pth)
              dest = out / f'{label}__{uid}{p.suffix or ".glb"}'
              shutil.copy2(p, dest)
              manifest['found'][label] = {'uid': uid, 'source': str(p), 'file': dest.name, 'bytes': dest.stat().st_size}
          if not manifest['found']:
              raise RuntimeError('No candidate donor objects were available through Objaverse')
          (out/'manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
          tar --zstd -cf /tmp/modern-car-donors-v2.tar.zst -C /tmp modern-car-donors-v2
          ls -lh /tmp/modern-car-donors-v2.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: modern-car-donors-v2
          path: /tmp/modern-car-donors-v2.tar.zst
          compression-level: 0
          retention-days: 1
