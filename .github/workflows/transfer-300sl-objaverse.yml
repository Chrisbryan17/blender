name: Transfer 300SL Objaverse Source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download CC BY 300SL model through Objaverse
        run: |
          python -m pip install --disable-pip-version-check objaverse
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          import objaverse

          candidates = [
              'f70d74f86cac4cbfa77d43d64aed256b',
              '65edd5814c9842bb9c769388d13fa27f',
              '505241c829c540a4921533000736904e',
              '3f49492bbed14d89b43cdc3efd5993c2',
          ]
          out = Path('/tmp/300sl_objaverse')
          out.mkdir(parents=True, exist_ok=True)
          found = {}
          for uid in candidates:
              try:
                  paths = objaverse.load_objects(uids=[uid], download_processes=1)
                  src = Path(paths[uid])
                  dst = out / f'{uid}{src.suffix or ".glb"}'
                  shutil.copy2(src, dst)
                  found[uid] = {'source': str(src), 'artifact': dst.name, 'bytes': dst.stat().st_size}
                  print(f'DOWNLOADED {uid}: {dst} ({dst.stat().st_size} bytes)')
              except Exception as exc:
                  found[uid] = {'error': repr(exc)}
                  print(f'FAILED {uid}: {exc!r}')
          (out / 'download_report.json').write_text(json.dumps(found, indent=2))
          if not any('artifact' in value for value in found.values()):
              raise SystemExit('No candidate model was downloaded')
          PY
          tar --zstd -cf /tmp/300sl_objaverse_sources.tar.zst -C /tmp 300sl_objaverse
          ls -lh /tmp/300sl_objaverse_sources.tar.zst /tmp/300sl_objaverse/*

      - uses: actions/upload-artifact@v4
        with:
          name: 300sl-objaverse-sources
          path: /tmp/300sl_objaverse_sources.tar.zst
          compression-level: 0
          retention-days: 1
